<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" width="80" height="110">
  <!-- Green Stem -->
  <rect x="36" y="55" width="8" height="55" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
  <!-- Green Leaves -->
  <ellipse cx="22" cy="80" rx="16" ry="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5" transform="rotate(-30 22 80)"/>
  <ellipse cx="58" cy="80" rx="16" ry="6" fill="#2ECC71" stroke="#27AE60" stroke-width="1.5" transform="rotate(30 58 80)"/>
  <!-- Top Jaw -->
  <path d="M12,42 C12,12 68,12 68,42 C68,32 40,24 12,42 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <!-- Bottom Jaw -->
  <path d="M14,46 C16,68 64,68 66,46 C50,54 30,54 14,46 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <!-- White Lips -->
  <path d="M10,42 C16,34 64,34 70,42 C62,38 18,38 10,42 Z" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1.5"/>
  <path d="M12,46 C20,53 60,53 68,46 C58,50 22,50 12,46 Z" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1.5"/>
  <!-- Teeth Upper -->
  <polygon points="20,40 24,45 28,40" fill="#FFFFFF"/>
  <polygon points="36,40 40,45 44,40" fill="#FFFFFF"/>
  <polygon points="52,40 56,45 60,40" fill="#FFFFFF"/>
  <!-- Teeth Lower -->
  <polygon points="28,48 32,43 36,48" fill="#FFFFFF"/>
  <polygon points="44,48 48,43 52,48" fill="#FFFFFF"/>
  <!-- White Polka Dots -->
  <circle cx="28" cy="24" r="5" fill="#FFFFFF"/>
  <circle cx="52" cy="23" r="4.5" fill="#FFFFFF"/>
  <circle cx="40" cy="16" r="4" fill="#FFFFFF"/>
  <circle cx="28" cy="56" r="3.5" fill="#FFFFFF"/>
  <circle cx="52" cy="55" r="3.5" fill="#FFFFFF"/>
</svg>
