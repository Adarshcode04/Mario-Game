  <ellipse class="goomba-foot-right" cx="44" cy="56" rx="14" ry="7" fill="#1C1510" stroke="#000" stroke-width="1.5"/>
  <!-- Stem/Body -->
  <path d="M22,36 C18,50 20,53 26,53 L38,53 C44,53 46,50 42,36 Z" fill="#FFE0B2" stroke="#000" stroke-width="2"/>
