  <polygon points="49,20 36,25 37,22 49,17" fill="#000"/>
  <!-- Eyes -->
  <ellipse cx="23" cy="27" rx="4.5" ry="6.5" fill="#FFF" stroke="#000" stroke-width="1"/>
  <ellipse cx="41" cy="27" rx="4.5" ry="6.5" fill="#FFF" stroke="#000" stroke-width="1"/>
  <ellipse cx="25" cy="27" rx="2" ry="4.5" fill="#000"/>
  <ellipse cx="39" cy="27" rx="2" ry="4.5" fill="#000"/>
  <!-- Fangs -->
  <polygon points="20,40 23,34 26,40" fill="#FFF" stroke="#000" stroke-width="1"/>
  <polygon points="38,40 41,34 44,40" fill="#FFF" stroke="#000" stroke-width="1"/>
</svg>
